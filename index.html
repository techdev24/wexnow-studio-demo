<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>WEX NOW Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEECE8; --card:#FFFFFF; --row:#F6F5F2; --line:#E2DFD9; --line2:#ECEAE5;
  --ink:#111111; --tx:#1C1C1C; --mut:#5C5C5C; --dim:#8C8C8C;
  --red:#E4002B; --redtx:#C8102E; --pink:#FDECEF;
  --green:#1E7B3A; --greenbg:#E6F4EA; --amber:#9A6A00; --amberline:#D9A43A; --amberbg:#FFF5E0;
  --blue:#2457C5; --bluebg:#E8EEFB; --airs:#C9D6F2;
  --head:"Archivo","IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--tx); background:var(--bg);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-size:14.5px;line-height:1.45;min-height:100vh}
button,input,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.mono{font-family:var(--mono)}

/* ===== header ===== */
.hdr{background:var(--ink);color:#fff;position:sticky;top:0;z-index:5}
.hrow{display:flex;align-items:center;gap:16px;padding:0 28px;height:62px}
.logo{font-family:var(--head);font-weight:800;font-size:21px;letter-spacing:-.2px;white-space:nowrap}
.logo span{color:var(--red)}
.vbar{width:1px;height:24px;background:#3A3A3A;flex:none}
.prod{font-family:var(--head);font-weight:700;font-size:16.5px;white-space:nowrap}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs a{color:#C9C9C9;padding:7px 12px;border-radius:7px;font-size:14px;white-space:nowrap}
.tabs a:hover{color:#fff;background:#1E1E1E}
.tabs a[aria-current="page"]{background:#2A2A2A;color:#fff}
.hright{margin-left:auto;display:flex;align-items:center;gap:12px;flex:none}
.hpill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px;white-space:nowrap;background:#163A22;color:#7BE29A}
.hpill i{width:7px;height:7px;border-radius:50%;background:#38C766;box-shadow:0 0 6px #38C766}
.clock{font-family:var(--mono);font-size:13.5px;color:#E6E6E6;white-space:nowrap}
.clock small{color:#9A9A9A;margin-left:3px}
.userbox{display:flex;align-items:center;gap:9px}
.av{width:32px;height:32px;border-radius:50%;background:var(--red);display:grid;place-items:center;font-weight:700;font-size:12.5px;flex:none}
.userbox select{background:#1E1E1E;border:1px solid #3A3A3A;border-radius:7px;color:#fff;padding:5px 8px;font-size:13px}

/* ===== page ===== */
.page{max-width:1480px;margin:0 auto;padding:24px 28px 56px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:1.4px;color:var(--redtx);text-transform:uppercase;margin:0 0 6px}
h1,h2,h3{font-family:var(--head);letter-spacing:-.25px;margin:0;color:var(--ink)}
h1{font-size:30px;font-weight:800;line-height:1.1}
h2{font-size:18px;font-weight:700}
.lead{color:var(--mut);margin:5px 0 0;max-width:78ch}
.card{background:var(--card);border-radius:16px;padding:20px}
.card.flush{padding:0;overflow:hidden}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.ch small{color:var(--mut)}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.g2e{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.mt{margin-top:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 15px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#BBB5AB}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.red:hover{background:#C8002A}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.redline{border-color:var(--red);color:var(--redtx)}
.btn.redline:hover{background:var(--pink)}
.btn[disabled]{color:var(--dim);cursor:not-allowed;border-color:var(--line);background:#fff}
.btn.sm{padding:5px 11px;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--greenbg);color:var(--green)}
.chip.warn{background:var(--amberbg);color:var(--amber)}
.chip.bad{background:var(--pink);color:var(--redtx)}
.chip.info{background:var(--bluebg);color:var(--blue)}
.chip.gray{background:#EFEDE9;color:var(--mut)}
.chip.live{background:var(--red);color:#fff}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.dot.live{background:var(--red);box-shadow:0 0 0 3px rgba(228,0,43,.15)}
.dot.ok{background:#2E9E57} .dot.warn{background:#D99A1E} .dot.plan{background:transparent;border:1.5px solid #A8A39A}
.small{font-size:13px;color:var(--mut);margin:0}
table{border-collapse:collapse;width:100%}
th{font-size:11.5px;font-weight:600;letter-spacing:1.1px;color:var(--mut);text-transform:uppercase;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.go{cursor:pointer}
tr.go:hover td{background:#FAF9F7}
.tw{overflow-x:auto}

/* thumbs: show-branded tile, real frame on top when it loads */
.th{position:relative;aspect-ratio:16/9;border-radius:6px;overflow:hidden;flex:none;display:flex;align-items:flex-end;padding:6px 7px;color:#fff}
.th .sn{font-family:var(--head);font-weight:800;font-size:11px;line-height:1.05;letter-spacing:.2px;max-width:70%;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.th .d{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.78);font-family:var(--mono);font-size:10.5px;padding:0 4px;border-radius:3px;z-index:1}
.th .bug{display:none}
.monitor .th .bug{display:block;position:absolute}
.player .th,.monitor .th,.phone .th,.vframe .th{aspect-ratio:auto;height:100%}
.vframe .th .sn{display:none}
.cc{display:flex;gap:12px;align-items:center;min-width:300px}
.cc b{display:block;font-weight:600;line-height:1.3}
.cc small{color:var(--mut);font-size:12.5px}

/* ===== control ===== */
.onair{background:var(--ink);color:#fff;border-radius:16px;padding:20px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px}
.onair .eyebrow{color:#FF4D6D}
.monitor{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000}
.monitor .th{position:absolute;inset:0;border-radius:0;padding:14px}
.monitor .th .sn{font-size:20px}
.monitor .th .bug{font-size:13px;right:12px;top:10px;background:var(--red);padding:2px 7px;border-radius:3px;opacity:1}
.monitor .tag{position:absolute;left:12px;top:10px;display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.7);font-size:11.5px;font-weight:700;letter-spacing:.8px;padding:3px 8px;border-radius:4px;z-index:2}
.monitor .cd{position:absolute;right:12px;bottom:10px;font-family:var(--mono);font-size:15px;background:rgba(0,0,0,.72);padding:2px 8px;border-radius:4px;z-index:2}
.monitor .slate{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,#2A0A12,#111);font-family:var(--head);font-weight:800;font-size:22px;z-index:1}
.oa-title{font-family:var(--head);font-weight:700;font-size:20px;line-height:1.25;margin:4px 0 12px;color:#fff}
.bar{height:5px;background:#363636;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red)}
.times{display:flex;justify-content:space-between;font-family:var(--mono);font-size:13px;color:#CFCFCF;margin-top:7px}
.nl{border-top:1px solid #2E2E2E;margin-top:14px;padding-top:12px;display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:9px 12px;font-size:14px}
.nl span{font-size:11.5px;font-weight:600;letter-spacing:1px;color:#A0A0A0;padding-top:2px}
.nl em{font-style:normal;font-family:var(--mono);font-size:12.5px;color:#A0A0A0}
.health{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.health div{background:#1C1C1C;border-radius:9px;padding:9px 11px}
.health small{display:block;font-size:11.5px;color:#9A9A9A}
.health b{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13.5px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--card);border-radius:14px;padding:14px 16px}
.kpi small{display:block;color:var(--mut);font-size:12.5px;font-weight:600}
.kpi b{display:block;font-family:var(--head);font-size:30px;font-weight:800;line-height:1.1;margin-top:2px}
.kpi span{font-size:12.5px;color:var(--mut)}
.kpi.r b{color:var(--redtx)} .kpi.g b{color:var(--green)} .kpi.a b{color:var(--amber)}
.alerts li{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:14px;padding:13px 0;border-top:1px solid var(--line2);align-items:center}
.alerts li:first-child{border-top:0}
.alerts .sev{align-self:stretch;border-radius:2px;background:var(--amberline)}
.alerts .sev.r{background:var(--red)} .alerts .sev.b{background:#9DB3E6}
.alerts b{display:block;font-weight:600}
.alerts .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin-top:2px}
.alerts .meta span b{display:inline;font-weight:600;color:var(--tx)}
ul.clean{list-style:none;margin:0;padding:0}
.trace select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff}
.path{margin-top:14px;display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;align-items:start;position:relative;padding-bottom:14px}
.step:not(:last-child)::after{content:"";position:absolute;left:10px;top:20px;bottom:0;width:2px;background:var(--line)}
.step .nd{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid var(--line);z-index:1}
.step .nd.live{border-color:var(--red);background:var(--red)}
.step .nd.ok{border-color:#2E9E57;background:#2E9E57}
.step .nd.warn{border-color:#D99A1E;background:#D99A1E}
.step b{display:block;font-weight:600}
.step small{color:var(--mut);font-size:12.5px}
.log li{display:grid;grid-template-columns:80px minmax(0,1fr) auto;gap:12px;padding:10px 0;border-top:1px solid var(--line2);font-size:13.5px}
.log li:first-child{border-top:0}
.log time{font-family:var(--mono);color:var(--mut);font-size:12.5px}
.log .who{color:var(--mut);font-size:12.5px}

/* ===== library ===== */
.lib{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;align-items:start}
.facets .grp{padding:14px 16px;border-top:1px solid var(--line2)}
.facets .grp:first-child{border-top:0}
.facets h3{font-family:inherit;font-size:11.5px;font-weight:600;letter-spacing:1.1px;color:var(--mut);text-transform:uppercase;margin:0 0 6px}
.facet{display:flex;justify-content:space-between;width:100%;background:none;border:0;padding:6px 9px;border-radius:7px;cursor:pointer;font-size:14px;text-align:left}
.facet:hover{background:var(--row)}
.facet[aria-pressed="true"]{background:var(--ink);color:#fff}
.facet span{opacity:.65}
.libbar{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.libbar input{flex:1 1 260px;border:1px solid var(--line);border-radius:9px;padding:9px 12px}
.ck{display:flex;gap:4px}
.ck i{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700}
.ck i.ok{background:var(--greenbg);color:var(--green)} .ck i.bad{background:var(--pink);color:var(--redtx)} .ck i.warn{background:var(--amberbg);color:var(--amber)} .ck i.na{background:#F0EEEA;color:#A8A39A}
.dests{display:flex;gap:4px}
.dc{font-family:var(--mono);font-size:10.5px;font-weight:600;padding:1px 5px;border-radius:4px;border:1px solid var(--line);color:#A8A39A}
.dc.on{color:var(--redtx);border-color:#F3B5C1;background:var(--pink)}
.dc.ok{color:var(--green);border-color:#B5DEC2;background:var(--greenbg)}
.dc.hold{color:var(--amber);border-color:#EED29A;background:var(--amberbg)}

/* ===== studio (clip) ===== */
.back{display:inline-block;color:var(--redtx);font-size:14px;margin-bottom:6px}
.ed{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(360px,1fr);gap:20px;align-items:start}
.player{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#151515}
.player .th{position:absolute;inset:0;border-radius:0;padding:18px}
.player .th .sn{font-size:24px}
.player .ov{position:absolute;inset:0;display:grid;place-items:center;z-index:2;background:rgba(0,0,0,.18);cursor:pointer;border:0;color:#fff}
.player .ov span{width:58px;height:58px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center}
.player .tc{position:absolute;left:12px;top:10px;font-family:var(--mono);font-size:15px;background:rgba(0,0,0,.65);color:#fff;padding:2px 8px;border-radius:4px;z-index:3}
.player .cut{position:absolute;right:12px;bottom:12px;background:var(--red);color:#fff;font-size:12px;font-weight:700;padding:3px 8px;border-radius:4px;z-index:3}
.player .lk{position:absolute;right:12px;top:10px;z-index:3}
.tline{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12.5px;color:var(--mut);margin:14px 0 6px}
.track{position:relative;height:42px;background:var(--airs);border-radius:7px;overflow:hidden}
.track .wv{position:absolute;inset:6px 4px;display:flex;align-items:center;gap:1px}
.track .wv i{flex:1;background:rgba(36,87,197,.28);border-radius:1px}
.track .trim{position:absolute;top:0;bottom:0;right:0;background:repeating-linear-gradient(135deg,#F3A6B4 0 6px,#FBD3DA 6px 12px)}
.track .bp{position:absolute;top:0;bottom:0;width:3px;background:var(--amber);transform:translateX(-1px)}
.track .ph{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px}
.trimctl{display:flex;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.trimctl b{font-weight:600}
.stp{width:40px;height:40px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:19px;cursor:pointer}
.stp:hover{border-color:#BBB5AB}
.tv{font-family:var(--mono);font-size:20px;min-width:58px;text-align:center}
.seg{display:flex;background:var(--row);border-radius:10px;padding:4px;gap:2px;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;border-radius:7px;padding:8px 6px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--mut)}
.seg button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chk li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;padding:10px 0;border-top:1px solid var(--line2);align-items:start}
.chk li:first-child{border-top:0}
.chk b{display:block;font-weight:600}
.chk small{color:var(--mut);font-size:12.5px}
.ver{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line2)}
.ver:first-child{border-top:0}
.ver b{display:block;font-weight:600}
.ver small{color:var(--mut);font-size:12.5px}
.vframe{width:64px;aspect-ratio:16/9;border-radius:5px;overflow:hidden;position:relative}
.vframe.v{width:30px;aspect-ratio:9/16}
.vframe .th{position:absolute;inset:0;border-radius:0;padding:3px}
.vframe .th .sn{font-size:7px}
.job{min-width:120px;text-align:right}
.pbar{height:5px;background:#ECEAE5;border-radius:3px;overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:var(--blue);transition:width .25s}
.bpi{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--amberbg);border-radius:10px;padding:11px 12px;margin-bottom:10px}
.bpi.sug{background:#fff;border:1.5px dashed var(--line)}
.bpi .t{font-family:var(--mono);font-size:15px;display:block}
.bpi small{color:var(--amber);font-size:12.5px}
.bpi.sug small{color:var(--mut)}
.wide{width:100%}
.vert{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:start;background:var(--row);border-radius:12px;padding:14px;margin-top:14px}
.phone{aspect-ratio:9/16;border-radius:14px;background:#000;position:relative;overflow:hidden;border:4px solid #1A1A1A}
.phone .th{position:absolute;inset:0;border-radius:0;padding:10px;align-items:center;justify-content:center}
.phone .th img{object-position:50% 50%}
.phone .cap{position:absolute;left:8px;right:8px;bottom:22%;text-align:center;font-family:var(--head);font-weight:800;font-size:12px;color:#fff;line-height:1.15;text-shadow:0 1px 3px #000;z-index:2}
.phone .cap em{font-style:normal;background:var(--red);padding:0 3px}
.phone .brand{position:absolute;left:8px;top:8px;font-family:var(--head);font-weight:800;font-size:10px;color:#fff;z-index:2}
.phone .brand span{color:var(--red)}

/* ===== planner ===== */
.ro{display:grid;grid-template-columns:minmax(0,1fr) 460px;gap:20px;align-items:start}
.ro-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.ro-head > div:first-child{flex:1 1 280px;min-width:0}
.pattern label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px}
.pattern select{border:1px solid var(--line);border-radius:9px;padding:9px 12px;min-width:190px;background:#fff}
.gcols{display:grid;grid-template-columns:30px 62px minmax(0,1fr) 72px 92px 136px;gap:12px;align-items:center}
.thr{font-size:11.5px;font-weight:600;letter-spacing:1.1px;color:var(--mut);text-transform:uppercase;padding:6px 12px}
.thr .r{text-align:right}
.ri{background:var(--row);border-radius:12px;padding:10px 12px}
.ri.now{background:var(--pink)}
.ri .n{color:var(--mut)} .ri .air,.ri .len{font-family:var(--mono);font-size:13.5px}
.ri .who2{display:flex;gap:12px;align-items:center;min-width:0}
.ri .th{width:84px}
.ri b{display:block;font-weight:600;line-height:1.3}
.ri small{color:var(--mut);font-size:12.5px}
.order{display:flex;gap:5px;justify-content:flex-end}
.ob{width:38px;height:36px;border:1px solid var(--line);background:#fff;border-radius:8px;display:grid;place-items:center;cursor:pointer}
.ob:hover{border-color:#BBB5AB}
.ob.x{color:var(--red)}
.ob[disabled]{opacity:.35;cursor:not-allowed}
.brk{display:flex;align-items:center;gap:12px;margin:5px 0 5px 116px;font-size:11.5px;font-weight:700;letter-spacing:1.1px;color:var(--amber);text-transform:uppercase;white-space:nowrap}
.brk.onnow{color:var(--redtx)}
.brk.onnow::before,.brk.onnow::after{border-top-color:var(--red)}
.brk::before,.brk::after{content:"";flex:1;border-top:1.5px dashed var(--amberline)}
.rol{display:flex;flex-direction:column;gap:6px}

const tc=s=>{s=Math.max(0,s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=Math.floor(s%60),f=Math.floor((s%1)*30);return [h,m,x,f].map(v=>String(v).padStart(2,"0")).join(":")};
const hhmm=sec=>{sec=((Math.floor(sec)%86400)+86400)%86400;return String(Math.floor(sec/3600)).padStart(2,"0")+":"+String(Math.floor(sec%3600/60)).padStart(2,"0")};

/* checks: the rules that decide what can go to TV */
function checks(c){
  const o=[];
  o.push(c.h>=1080?{k:"ok",s:"V",l:"Full HD video",n:`${c.h===1080?"1920×1080":c.h+"p"}`}:c.h>=720?{k:"warn",s:"V",l:"HD video, not full HD",n:"720p. Airs, but 1080p looks better on TV"}:{k:"bad",s:"V",l:"Video too small for TV",n:`${c.h}p. TV needs 720p or higher`,short:`${c.h}p`});
  o.push(c.thumb?{k:"ok",s:"T",l:"Full-size thumbnail",n:"1920×1080"}:{k:"bad",s:"T",l:"No full-size thumbnail",n:"TV needs 1920×1080",short:"No full thumbnail"});
  o.push(c.desc==="ok"?{k:"ok",s:"D",l:"Description",n:"Clean"}:c.desc==="links"?{k:"warn",s:"D",l:"Links and hashtags in description",n:"Removed automatically for TV"}:{k:"bad",s:"D",l:"No description",n:"Add one in Brid. Clips without one stay off TV",short:"No description"});
  o.push(c.t.length<=100?{k:"ok",s:"L",l:"Title length",n:`${c.t.length} of 100 characters`}:{k:"bad",s:"L",l:"Title too long",n:`${c.t.length} characters. TV allows 100`,short:"Long title"});
  o.push(c.tf===true?{k:"ok",s:"F",l:"Text-free thumbnail",n:"Confirmed by editorial"}:c.tf===false?{k:"warn",s:"F",l:"Text on thumbnail",n:"Airs, but Amazon won't promote it on Alexa"}:{k:"na",s:"F",l:"Text-free thumbnail",n:"Not confirmed yet"});
  o.push(c.promo!=null?{k:"ok",s:"P",l:"End promo trimmed",n:`Last ${c.promo} seconds removed for TV`}:{k:"na",s:"P",l:"End promo",n:"Cut point not set yet"});
  return o;
}
const fails=c=>checks(c).filter(x=>x.k==="bad");
const tvReady=c=>fails(c).length===0;

  const inApps=c.id>200000; /* the five real clips are in the WEX NOW Daily row on both apps */

/* ===================== 24/7 SCHEDULE ENGINE ===================== */
function breakAfter(idx,list){
  if(idx>=list.length-1&&S.pattern!=="every") return false;
  if(S.pattern==="every") return true;
  if(S.pattern==="two") return idx%2===1;
  if(S.pattern==="none") return false;
  if(S.pattern==="15"){let t=0;for(let k=0;k<=idx;k++)t+=byId(list[k]).dur;const p=t-byId(list[idx]).dur;return Math.floor(t/900)>Math.floor(p/900)}
  return true;
}
function sequence(){
  const s=[];S.lineup.forEach((id,i)=>{const c=byId(id);const trim=S.trim[id]??c.promo??0;s.push({type:"p",c,dur:c.dur-trim});if(breakAfter(i,S.lineup))s.push({type:"k",dur:120});});
  return s;
}
function at(t){const seq=sequence();const L=seq.reduce((a,b)=>a+b.dur,0);if(!L)return null;let o=((t%L)+L)%L,i=0;while(o>=seq[i].dur){o-=seq[i].dur;i++}return{seq,L,i,off:o,start:t-o}}

function drawEPG(){
  const el=$("#epg"); if(!el) return; const end=epg0+WIN, now=etSec(); const a=at(epg0); if(!a){el.innerHTML="";return}

  let bl="",mk="",t=a.start,i=a.i;
  while(t<end){const s=a.seq[i];const l=Math.max(0,(t-epg0)/WIN*100),r=Math.min(100,(t+s.dur-epg0)/WIN*100),w=r-l,past=t+s.dur<now?" past":"",txt=w>4.2;
    if(w>0){if(s.type==="p"){const cls=s.c.show==="Daily News Hits"?"p":"m";bl+=`<div class="eb ${cls}${past}" style="left:${l}%;width:calc(${w}% - 3px)" title="${esc(s.c.t)}, ${hhmm(t)}">${txt?`<b>${esc(s.c.t)}</b><small>${hhmm(t)}, ${mmss(s.dur)}</small>`:""}</div>`}
      else{bl+=`<div class="eb k${past}" style="left:${l}%;width:calc(${w}% - 3px)" title="Ad break ${hhmm(t)}">${txt?`<b>Ad break</b><small>${mmss(s.dur)}</small>`:""}</div>`;if(t>=epg0)mk+=`<div class="mk" style="left:${l}%" title="Ad marker at ${hhmm(t)}"></div>`}}
    t+=s.dur;i=(i+1)%a.seq.length}

}

}

  </div>`;
}
function sw(k,title,sub,on,locked){return `<div class="rule"><div><b>${title}</b><small>${sub}</small></div><span class="sw"><input type="checkbox" data-rule="${k}" ${on?"checked":""} ${locked?"disabled":""} aria-label="${title}"><span></span></span></div>`}
function queueHTML(){
  return S.soc.queue.map(q=>{const c=byId(q.id);const [cls,lab]=stLabel[q.st];
    return `<li class="${String(q.id)===String(S.soc.sel)?"sel":""}" data-sel="${q.id}"><div class="mini">${thumb(c)}</div>
      <div><b>${esc(c.t)}</b><small>${esc(c.show)}${q.st==="posted"?`, ${q.at}`:""}</small>${q.st==="processing"?`<div class="pbar"><i style="width:${q.pct||0}%"></i></div>`:""}</div>
      <span class="chip ${cls}">${lab}</span></li>`}).join("");
}
/* background pipeline: queued -> making vertical -> ready for review; scheduled -> posted */
setInterval(()=>{
  const qu=S.soc.queue; let changed=false;
  let pr=qu.find(q=>q.st==="processing");
  if(!pr){pr=qu.find(q=>q.st==="queued");if(pr){pr.st="processing";pr.pct=0;changed=true}}
  if(pr){pr.pct=Math.min(100,(pr.pct||0)+4+Math.random()*5);changed=true;
    if(pr.pct>=100){pr.st="ready";log("Vertical version ready",byId(pr.id).t);if(location.hash.startsWith("#/social"))toast("New vertical ready for review: "+byId(pr.id).t.slice(0,60))}}
  qu.filter(q=>q.st==="scheduled"&&Date.now()>=q.due).forEach(q=>{q.st="posted";q.at=hhmm(etSec());changed=true;log("Posted vertical",byId(q.id).t+" to "+q.to)});
  if(changed&&location.hash.startsWith("#/social")){const ul=$("#queue");if(ul)ul.innerHTML=queueHTML(),wireQueue();const sel=qu.find(q=>String(q.id)===String(S.soc.sel));const st=$("#selst");if(st&&sel&&st.dataset.k!==sel.st){st.dataset.k=sel.st;if(sel.st==="ready"||sel.st==="posted")render()}}
},600);
function wireQueue(){$$("[data-sel]").forEach(li=>li.addEventListener("click",()=>{S.soc.sel=isNaN(+li.dataset.sel)?li.dataset.sel:+li.dataset.sel;S.soc.start=0;history.replaceState(null,"","#/social");render()}))}
let capTimer=null;
function socialLive(){
  clearInterval(capTimer);
  const c=byId(S.soc.sel)||byId(S.soc.queue[0].id); const v=$("#svid"); const words=hookFor(c).split(" ").concat(c.t.split(" ")).filter(Boolean);
  if(v){v.addEventListener("loadedmetadata",()=>{try{v.currentTime=S.soc.start}catch(e){}});
    const last=v.querySelector("source[data-last]");if(last)last.addEventListener("error",()=>{v.style.display="none";if(!S.warned){S.warned=true;toast("The clip couldn't load from Brid here, so the preview shows the thumbnail.")}});}
  let t0=Date.now();
  capTimer=setInterval(()=>{
    const so=S.soc; const ct=v&&!isNaN(v.currentTime)&&v.readyState>1?v.currentTime:so.start+((Date.now()-t0)/1000)%so.len;
    if(v&&v.readyState>1&&(ct>so.start+so.len||ct<so.start-0.5)){try{v.currentTime=so.start}catch(e){}}
    const pr=$("#sprog");if(pr)pr.style.width=Math.max(0,Math.min(100,(ct-so.start)/so.len*100))+"%";
    const cp=$("#scaps");if(cp){const i=Math.floor((ct-so.start)*2.6)%words.length;const s0=Math.floor(i/4)*4;cp.innerHTML=words.slice(s0,s0+4).map((w,k)=>s0+k===i?`<em>${esc(w)}</em>`:esc(w)).join(" ")}
    if(so.auto&&v){const x=50+Math.sin(Date.now()/2600)*6;v.style.objectPosition=x+"% 50%"}
  },120);
}

/* ===================== CONNECT ===================== */
const DEST={
  fire:{g:"FT",n:"Fire TV app",type:"Owned app",st:"live",sl:"Live",sub:"11 rows from Brid playlists"},
  roku:{g:"RK",n:"Roku app",type:"Owned app",st:"live",sl:"Live",sub:"11 rows, matched Aug 31"},
  web:{g:"WN",n:"wexnow.tv",type:"Owned web",st:"live",sl:"Live",sub:"Web home for WEX NOW"},
  amazon:{g:"AZ",n:"Amazon free channel",type:"Free channel, on demand",st:"live",sl:"Live",sub:"Fire TV News lineup"},
  yt:{g:"YT",n:"YouTube",type:"Social and web",st:"ok",sl:"Live",sub:"Clean cut plus outro, next"},
  rokuch:{g:"RC",n:"Roku free channel",type:"Free channel, 24/7",st:"plan",sl:"Jan 1",sub:"Same stream as Amazon 24/7"},
  ch247:{g:"24",n:"WEX NOW 24/7",type:"Our own stream",st:"plan",sl:"Preview",sub:"Amazon first, then Roku"},
  samsung:{g:"SM",n:"Samsung TV app",type:"Owned app",st:"plan",sl:"Jan 1",sub:"Same playlists as Fire TV and Roku"},
  social:{g:"SO",n:"Reels, Shorts, TikTok",type:"Social, vertical",st:"ok",sl:"Automated",sub:"Vertical versions, editor approves"}
};
function connect(p){
  const ed=S.role==="editor"; const d=p.get("d")||S.dest; S.dest=d; const x=DEST[d]||DEST.amazon;
  return `<div class="ph"><div><p class="eyebrow">Distribution</p><h1>Connect</h1><p class="lead">One video, every screen. Each destination plugs in through its own connector, so adding one never touches the others.</p></div>
    ${ed?"":`<button class="btn" data-toast="Adds a destination by plugging in a new connector. Nothing else in the Studio changes.">Add destination</button>`}</div>
  ${ed?`<div class="lockn">${I.lock}<span><b>Managed by Digital.</b> You can see where video goes. Connections and settings stay with Digital.</span></div>`:""}
  <div class="dl">
    <div class="tiles">${Object.entries(DEST).map(([k,v])=>`<button class="tile" data-dest="${k}" aria-pressed="${k===d}"><span class="gl ${v.st}">${v.g}</span><span><b>${v.n}</b><small>${v.type}</small><span class="s"><span class="dot ${v.st}"></span>${v.sl}</span><small>${v.sub}</small></span></button>`).join("")}</div>
    <section class="card">${destDetail(d,x,ed)}</section>
  </div>`;
}
function destDetail(k,x,ed){
  const head=`<div class="ch"><div style="display:flex;gap:12px;align-items:center"><span class="gl ${x.st}">${x.g}</span><div><h2>${x.n}</h2><small>${x.type}</small></div></div><span class="chip ${x.st==="live"?"live":x.st==="ok"?"ok":"gray"}">${x.sl}</span></div>`;
  if(k==="amazon")return head+`<dl class="kv"><dt>How it's fed</dt><dd>On-demand feed, checked by Amazon every 5 minutes</dd><dt>Placement</dt><dd>Fire TV News lineup, beside national networks</dd><dt>Ads</dt><dd>Sold and inserted by Amazon; revenue shared monthly</dd><dt>First run</dt><dd>20 clips in, 15 sent, 5 held back</dd>${ed?"":`<dt>Source playlist</dt><dd class="mono">25675</dd>`}</dl>
    <h3 style="font-size:14px;margin:16px 0 6px;font-family:inherit">Rules applied before anything is sent</h3><ul class="clean rules"><li>Full HD video file, never the streaming version</li><li>Only 1920×1080 thumbnails</li><li>Links, hashtags and emoji stripped; titles capped at 100</li><li>Clips with no description are held back, not lost</li><li>Each clip keeps one stable ID, so nothing duplicates</li></ul>
    <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="btn" data-toast="Shows exactly which clips were sent and which were held back, and why.">View last check</button>${ed?"":`<button class="btn redline" data-toast="Only clips an editor approves for TV go to Amazon. Today the feed takes every published clip.">Turn on TV approval</button>`}</div>`;
  if(k==="fire"||k==="roku")return head+`<div class="tw"><table><thead><tr><th>Row</th>${ed?"":"<th>Fire TV</th><th>Roku</th>"}<th></th></tr></thead><tbody>${APP_ROWS.map(r=>`<tr><td>${r[0]}</td>${ed?"":`<td class="mono">${r[1]}</td><td class="mono">${r[2]}</td>`}<td>${r[3]?`<span class="chip warn">${r[3]}</span>`:`<span class="chip ok">Matches</span>`}</td></tr>`).join("")}</tbody></table></div>`;
  if(k==="yt")return head+`<dl class="kv"><dt>Today</dt><dd>Posted outside the Studio, with the end promo baked in</dd><dt>Next</dt><dd>Clean master from Brid, outro added by rule per show, YouTube end screen on top</dd><dt>Shorts</dt><dd>From the vertical versions made in the Studio</dd></dl>`;
  if(k==="social")return head+`<a class="btn sm redline" href="#/social" style="margin-bottom:12px">Open Social</a><dl class="kv"><dt>What goes out</dt><dd>Vertical 9:16 versions with burned-in captions and WEX NOW branding</dd><dt>Approval</dt><dd>An editor approves every post</dd><dt>Accounts</dt><dd>Connected by Digital; editors never see logins</dd></dl>`;
  if(k==="ch247"||k==="rokuch")return head+`<dl class="kv"><dt>Built from</dt><dd>The Planner's running order and weekly schedule</dd><dt>Stream</dt><dd>Continuous HD stream with ad markers at every break</dd><dt>Ads</dt><dd>Filled by the platform; we mark where breaks go</dd><dt>Safety</dt><dd>A failed clip is skipped; the channel never goes dark</dd><dt>Status</dt><dd>${k==="ch247"?"Preview running in Playout. Waiting on enough programming to fill the day.":"Applying to Roku's free channel lineup; target Jan 1"}</dd></dl><a class="btn mt" href="#/playout">Open playout</a>`;
  if(k==="samsung")return head+`<dl class="kv"><dt>Type</dt><dd>Our own app, like Fire TV and Roku</dd><dt>Content</dt><dd>Same Brid playlists and rows</dd><dt>Target</dt><dd>Jan 1</dd></dl>`;
  return head+`<dl class="kv"><dt>Type</dt><dd>${x.type}</dd><dt>Status</dt><dd>${x.sl}</dd><dt>Notes</dt><dd>${x.sub}</dd></dl>`;
}

/* ===================== ROUTER ===================== */
let timer=null;
function render(){
  const ov=$("#vid"); if(ov&&ov.dataset.cid) S.vt[ov.dataset.cid]=ov.currentTime;
  const raw=location.hash.replace(/^#\/?/,"")||"control"; const [path,qs]=raw.split("?"); const parts=path.split("/"); const p=new URLSearchParams(qs||"");
  let r=parts[0],html;
  if(r==="library")html=library(p);
  else if(r==="clip"){html=clip(parts[1],p.get("tab"));r="library"}
  else if(r==="planner")html=planner();
  else if(r==="playout")html=playout();
  else if(r==="connect")html=connect(p);
  else if(r==="social")html=social(p);
  else{html=control();r="control"}
  const app=$("#app");app.innerHTML=html;
  $$(".tabs a").forEach(a=>a.toggleAttribute("aria-current",false));const cur=$(`.tabs a[data-r="${r}"]`);if(cur)cur.setAttribute("aria-current","page");
  clearInterval(timer); clearInterval(capTimer);
  if(r==="social")socialLive();
  if(r==="control"||r==="playout"){if(r==="playout")drawEPG();tickChannel();timer=setInterval(tickChannel,250)}
  wire(p,parts);
}
function rerenderKeep(id){const el=$("#"+id);const pos=el?el.selectionStart:0;render();const n=$("#"+id);if(n){n.focus();n.setSelectionRange(pos,pos)}}
function wire(p,parts){
  $$("[data-toast]").forEach(b=>b.addEventListener("click",()=>toast(b.dataset.toast)));
  $$("tr.go").forEach(tr=>{const go=()=>location.hash=tr.dataset.go;tr.addEventListener("click",go);tr.addEventListener("keydown",e=>{if(e.key==="Enter")go()})});
  $$(".facet").forEach(b=>b.addEventListener("click",()=>{S.libf=b.dataset.f;location.hash="#/library?f="+b.dataset.f}));
  const lq=$("#libq");if(lq)lq.addEventListener("input",()=>{S.libq=lq.value;history.replaceState(null,"","#/library?f="+(p.get("f")||S.libf)+"&q="+encodeURIComponent(lq.value));rerenderKeep("libq")});
  const tr=$("#trace");if(tr)tr.addEventListener("change",()=>{S.trace=tr.value;$("#path").innerHTML=tracePath(byId(tr.value))});
  $$("[data-tab]").forEach(b=>b.addEventListener("click",()=>location.hash=`#/clip/${parts[1]}?tab=${b.dataset.tab}`));
  $$("[data-job]").forEach(b=>b.addEventListener("click",()=>startJob(byId(parts[1]).id,b.dataset.job)));
  const tm=$("#tm"),tp=$("#tp");
  if(tm){const c=byId(parts[1]);const cur=()=>S.trim[c.id]??c.promo??15;tm.addEventListener("click",()=>{S.trim[c.id]=Math.max(0,cur()-1);render()});tp.addEventListener("click",()=>{S.trim[c.id]=Math.min(60,cur()+1);render()})}
  $$("[data-approve]").forEach(b=>b.addEventListener("click",()=>{const c=byId(parts[1]);const bp=S.bps[c.id].find(x=>x.t===+b.dataset.approve);bp.ok=true;bp.l="Approved, "+(S.role==="admin"?"Digital admin":"Video desk");log("Approved break point "+mmss(bp.t),c.t);toast("Break point approved. It's marked on the timeline.");render()}));
  const ab=$("#addbp");if(ab)ab.addEventListener("click",()=>{const c=byId(parts[1]);const t=Math.round(c.dur*0.46);S.bps[c.id]=S.bps[c.id]||[];if(S.bps[c.id].some(b=>b.t===t)){toast("There's already a break point there.");return}S.bps[c.id].push({t,l:"Added at the playhead",ok:true});log("Added break point "+mmss(t),c.t);toast("Break point added at "+mmss(t)+".");render()});
  $$("[data-ptab]").forEach(b=>b.addEventListener("click",()=>{S.ptab=b.dataset.ptab;render()}));
  $$("[data-up]").forEach(b=>b.addEventListener("click",()=>{const i=+b.dataset.up;[S.lineup[i-1],S.lineup[i]]=[S.lineup[i],S.lineup[i-1]];log("Moved a clip up",byId(S.lineup[i-1]).t);render()}));
  $$("[data-down]").forEach(b=>b.addEventListener("click",()=>{const i=+b.dataset.down;[S.lineup[i+1],S.lineup[i]]=[S.lineup[i],S.lineup[i+1]];log("Moved a clip down",byId(S.lineup[i+1]).t);render()}));
  $$("[data-rm]").forEach(b=>b.addEventListener("click",()=>{const [id]=S.lineup.splice(+b.dataset.rm,1);log("Removed from the lineup",byId(id).t);toast("Removed. Publish to update the channel.");render()}));
  $$("[data-add]").forEach(b=>b.addEventListener("click",()=>{const id=isNaN(+b.dataset.add)?b.dataset.add:+b.dataset.add;S.lineup.push(id);log("Added to the lineup",byId(id).t);toast("Added to the end of the lineup. Publish to update the channel.");render()}));
  const pat=$("#pat");if(pat)pat.addEventListener("change",()=>{S.pattern=pat.value;log("Changed the ad break pattern",pat.options[pat.selectedIndex].text);render()});
  const pub=$("#pub");if(pub)pub.addEventListener("click",()=>{log("Published the 24/7 lineup",`${S.lineup.length} clips`);toast("Published. The channel picks up the new lineup within minutes.");render()});
  const plq=$("#plq");if(plq)plq.addEventListener("input",()=>{S.q=plq.value;rerenderKeep("plq")});
  $$("[data-dest]").forEach(b=>b.addEventListener("click",()=>{S.dest=b.dataset.dest;history.replaceState(null,"","#/connect?d="+b.dataset.dest);render()}));

  /* clip player */
  const v=$("#vid"), vb=$("#vplay");
  if(vb){const c=byId(parts[1]);
    if(!v){vb.addEventListener("click",()=>toast("Video preview plays once this clip syncs from Brid. The five clips published Oct 1 play now."));}
    else{
      v.dataset.cid=c.id; const trimNow=()=>S.trim[c.id]??c.promo??15; let previewing=false;
      const last=v.querySelector("source[data-last]");if(last)last.addEventListener("error",()=>{v.style.display="none";const f=$("#vfail");if(f)f.style.display="block"});
      v.addEventListener("loadedmetadata",()=>{if(S.vt[c.id]){try{v.currentTime=S.vt[c.id]}catch(e){}}});
      vb.addEventListener("click",()=>{if(v.paused){v.play().catch(()=>toast("Click play again to start the preview."))}else v.pause()});
      v.addEventListener("play",()=>vb.classList.add("playing"));v.addEventListener("pause",()=>vb.classList.remove("playing"));
      v.addEventListener("timeupdate",()=>{const d=v.duration||c.dur;$("#vtc").textContent=tc(v.currentTime);$("#vph").style.left=(v.currentTime/d*100)+"%";
        const airs=d-trimNow(); if(previewing&&v.currentTime>=airs){v.pause();previewing=false;toast("Stopped at "+mmss(airs)+". That's where the TV version ends.")}});
      $("#trk").addEventListener("click",e=>{const r=e.currentTarget.getBoundingClientRect();const d=v.duration||c.dur;v.currentTime=Math.max(0,Math.min(d,(e.clientX-r.left)/r.width*d))});
      $("#pcut").addEventListener("click",()=>{const d=v.duration||c.dur;const airs=d-trimNow();previewing=true;v.currentTime=Math.max(0,airs-20);v.play().catch(()=>{});toast("Playing the last 20 seconds before the cut.")});
    }}
  const pc=$("#pcut"); if(pc&&!v){pc.addEventListener("click",()=>toast("The cut preview plays once this clip syncs from Brid."))}
  /* social */
  if(location.hash.startsWith("#/social")){
    const so=S.soc; const c=byId(so.sel)||byId(so.queue[0].id);
    wireQueue();
    $$("[data-show]").forEach(b=>b.addEventListener("click",()=>{so.rules[b.dataset.show]=!so.rules[b.dataset.show];log((so.rules[b.dataset.show]?"Turned on":"Turned off")+" auto verticals",b.dataset.show);render()}));
    $$("[data-plat]").forEach(b=>b.addEventListener("click",()=>{so.plats[b.dataset.plat]=!so.plats[b.dataset.plat];render()}));
    $$("[data-rule]").forEach(i=>i.addEventListener("change",()=>{so.rules[i.dataset.rule]=i.checked;render()}));
    $$("[data-fmt]").forEach(b=>b.addEventListener("click",()=>{so.fmt=b.dataset.fmt;render()}));
    $$("[data-len]").forEach(b=>b.addEventListener("click",()=>{so.len=+b.dataset.len;render()}));
    const pos=$("#pos");if(pos)pos.addEventListener("input",()=>{so.pos=+pos.value;const sv=$("#svid");if(sv)sv.style.objectPosition=so.pos+"% 50%"});
    const au=$("#auto");if(au)au.addEventListener("change",()=>{so.auto=au.checked;if(!so.auto)so.pos=50;render()});
    const hk=$("#hook");if(hk)hk.addEventListener("input",()=>{so.hook[c.id]=hk.value;const h=$("#shook");if(h)h.textContent=hk.value});
    const st=$("#start");if(st)st.addEventListener("input",()=>{so.start=+st.value;$("#startv").textContent=mmss(so.start);const sv=$("#svid");if(sv&&sv.readyState>0){try{sv.currentTime=so.start}catch(e){}}});
    const ap=$("#approve");if(ap)ap.addEventListener("click",()=>{const to=Object.entries(so.plats).filter(x=>x[1]).map(x=>PLAT[x[0]]);if(!to.length){toast("Pick at least one place to post.");return}
      const q=so.queue.find(x=>String(x.id)===String(c.id));q.st="scheduled";q.to=to.join(", ");q.at=hhmm(etSec()+60);q.due=Date.now()+8000;
      log("Approved vertical",c.t);toast("Approved. Posting to "+q.to+" in about a minute.");render()});
    const rj=$("#reject");if(rj)rj.addEventListener("click",()=>{so.queue=so.queue.filter(x=>String(x.id)!==String(c.id));so.sel=(so.queue.find(x=>x.st==="ready")||so.queue[0]).id;log("Sent back a vertical",c.t);toast("Sent back. It won't post.");render()});
    const ra=$("#runauto");if(ra)ra.addEventListener("click",()=>{const next=CLIPS.find(x=>so.rules[x.show]&&!so.queue.some(q=>String(q.id)===String(x.id)));
      if(!next){toast("Every clip from the selected shows already has a vertical version.");return}
      so.queue.unshift({id:next.id,st:"queued"});log("Automation picked up a new clip",next.t);toast("Picked up: "+next.t.slice(0,60)+". It's in the queue.");render()});
  }
}
$("#role").addEventListener("change",e=>{S.role=e.target.value;$("#av").textContent=S.role==="admin"?"DA":"VD";render();toast(S.role==="editor"?"Signed in as an editor: playlist IDs, connections and settings are hidden.":"Signed in as Digital admin.")});
function clk(){$("#clock").innerHTML=new Date().toLocaleTimeString("en-US",{timeZone:"America/New_York",hour12:false})+"<small>ET</small>"}
setInterval(clk,1000);clk();
window.addEventListener("hashchange",render);render();
</script>
